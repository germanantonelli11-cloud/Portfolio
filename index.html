<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Antonelli | Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .portfolio-container { max-width: 700px; width: 100%; }
        h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 5px; }
        p.subtitle { color: #8b949e; font-size: 1.1rem; margin-top: 0; margin-bottom: 40px; }
        h2 { color: #f0f6fc; border-bottom: 1px solid #21262d; padding-bottom: 10px; font-size: 1.4rem; margin-top: 30px; }
        ul { list-style-type: none; padding: 0; }
        li {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 12px;
            font-size: 1.05rem;
            color: #e6edf3;
        }
        input[type="text"] {
            padding: 12px; width: 65%; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: white; font-size: 1rem; margin-right: 10px;
        }
        .submit-btn {
            padding: 12px 20px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="portfolio-container">
        <h1>Welcome to the Portfolio of <span th:text="${developerName}">Developer</span></h1>
        <p class="subtitle">Building real-world software engineering systems.</p>

        <h2>Project Showcase</h2>
        <ul>
            <li th:each="project : ${myProjects}" th:text="${project.name}">Project Name Placeholder</li>
        </ul>

        <h2>Suggest a Project Extension</h2>
        <form th:action="@{/add-project}" method="POST">
            <input type="text" name="projectName" placeholder="Enter project idea..." required>
            <button type="submit" class="submit-btn">Submit Idea</button>
                <!-- ... keeping your project suggestion form directly above ... -->
        </form>

        <!-- Small professional navigation footer containing your admin doorway -->
        <footer style="margin-top: 60px; padding-top: 20px; border-top: 1px solid #21262d; display: flex; justify-content: space-between; font-size: 0.85rem; color: #8b949e;">
            <span>© 2026 German Antonelli</span>
            <a href="./admin" style="color: #8b949e; text-decoration: none; font-weight: 500; transition: color 0.2s;" 
               onmouseover="this.style.color='#58a6ff'" onmouseout="this.style.color='#8b949e'">
                Admin Dashboard Interface →
            </a>
        </footer>
    </div> <!-- This is your existing portfolio-container closing tag -->
</body>
</html>
