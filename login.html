<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #f0f6fc; margin-bottom: 20px; font-size: 1.6rem; }
        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-btn:hover { background-color: #388bfd; }
        .error-banner {
            background-color: #2c0d0d;
            border: 1px solid #da3633;
            color: #f85149;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none; /* Hidden by default for static site */
        }
        a { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Sign-In</h2>
        
        <!-- Error panel (set display to none for static HTML) -->
        <div class="error-banner">Invalid security signature</div>

        <form action="#" method="POST">
            <input type="password" name="adminPassword" placeholder="Enter security signature..." required autofocus>
            <button type="submit" class="login-btn">Authenticate Access</button>
        </form>
        
        <p style="margin-top: 25px;"><a href="./">← Return to Showcase</a></p>
    </div>

</body>
</html>
