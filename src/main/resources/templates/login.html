<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #f0f6fc; font-size: 1.6rem; }
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1f6feb;
            color: #fff;
            border: 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #388bfd; }
        button:disabled { opacity: .6; cursor: wait; }
        #status { min-height: 1.4em; color: #f85149; }
        a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>Admin Sign-In</h1>

        <form id="login-form">
            <input
                type="password"
                name="adminPassword"
                aria-label="Admin password"
                placeholder="Enter security signature..."
                required
                autofocus
            >
            <button type="submit">Authenticate Access</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <a href="./">← Return to Showcase</a>
    </main>

    <script>
        // Send login requests to the Render backend.
        const API_BASE_URL = 'https://portfolio-j3hj.onrender.com';
        const form = document.getElementById('login-form');
        const status = document.getElementById('status');

        // Authenticate without storing the password in the browser.
        form.addEventListener('submit', async event => {
            event.preventDefault();

            const button = form.querySelector('button');
            const password = form.elements.adminPassword.value;

            button.disabled = true;
            status.textContent = 'Checking password...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ adminPassword: password })
                });

                if (!response.ok) {
                    throw new Error(`Login failed (${response.status}).`);
                }

                const data = await response.json();

                if (!data.token) {
                    throw new Error('The server did not return a login token.');
                }

                // Save only the token for this browser tab.
                sessionStorage.setItem('portfolioAdminToken', data.token);
                window.location.assign('./admin.html');
            } catch (error) {
                status.textContent = error.message === 'Login failed (401).'
                    ? 'Incorrect password.'
                    : 'Could not sign in. Please try again.';

                console.error('Admin login failed:', error);
            } finally {
                form.elements.adminPassword.value = '';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
